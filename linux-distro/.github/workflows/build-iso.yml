name: Build KodeOS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "linux-distro/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    name: Debian Live ISO (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: linux-distro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Configure KodeOS
        run: |
          sudo lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --debian-installer live

      - name: Build ISO
        run: sudo lb build

      - name: Generate checksums
        run: |
          shopt -s nullglob
          isos=( *.iso )
          if (( ${#isos[@]} == 0 )); then
            echo "No ISO was produced" >&2
            exit 1
          fi
          sha256sum "${isos[@]}" | tee SHA256SUMS

      - name: Upload KodeOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: kodeos-developer-live-amd64
          path: |
            linux-distro/*.iso
            linux-distro/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
